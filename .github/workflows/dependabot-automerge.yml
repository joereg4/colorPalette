name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Branch protection requires an up-to-date branch (strict status checks)
      # and the required "test" check. Immediate `gh pr merge` races both:
      # checks that just passed may not be visible to the merge API yet, and
      # sibling Dependabot PRs leave others behind master. --auto queues the
      # merge with GitHub until those requirements are actually satisfied.
      - name: Enable auto-merge for Dependabot PR
        run: |
          gh pr update-branch "$PR_URL" || true
          gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
